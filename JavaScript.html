  // ==========================================================================
  // 1. PARTIKEL SILUET HATI & KILAU EMAS MELAYANG BERULANG KONTINU
  // ==========================================================================
  function initPetalAnimation() {
    var canvas = document.getElementById('petalCanvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var petals = [];
    var petalCount = 26;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function createPetal(burst, fromTop) {
      return {
        x: burst ? (canvas.width * 0.5 + (Math.random() * 180 - 90)) : Math.random() * canvas.width,
        y: burst ? (canvas.height * 0.42 + (Math.random() * 160 - 80)) : (fromTop ? (Math.random() * -60 - 15) : Math.random() * canvas.height),
        size: Math.random() * 5.5 + 8.5,
        speedX: burst ? (Math.random() * 7 - 3.5) : 0,
        speedY: burst ? (Math.random() * -5.5 + 1.8) : (Math.random() * 0.5 + 0.5),
        sway: Math.random() * Math.PI * 2,
        swaySpeed: Math.random() * 0.02 + 0.01,
        angle: Math.random() * Math.PI * 2,
        spin: Math.random() * 0.022 - 0.011,
        opacity: Math.random() * 0.22 + 0.18,
        isHeart: Math.random() > 0.22,
        isGoldDust: Math.random() > 0.78
      };
    }

    for (var i = 0; i < petalCount; i++) {
      petals.push(createPetal(false, false));
    }

    window.triggerPetalBurst = function() {
      for (var b = 0; b < 32; b++) {
        petals.push(createPetal(true, false));
      }
    };

    function renderPetals() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (var j = 0; j < petals.length; j++) {
        var p = petals[j];
        p.sway += p.swaySpeed;
        p.x += p.speedX + Math.sin(p.sway) * 0.6;
        p.y += p.speedY;
        p.angle += p.spin;

        if (p.y > canvas.height + 25 || p.x < -35 || p.x > canvas.width + 35) {
          if (petals.length > petalCount) {
            petals.splice(j, 1);
            j--;
            continue;
          } else {
            petals[j] = createPetal(false, true);
          }
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.globalAlpha = p.opacity;

        if (p.isGoldDust) {
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.26, 0, Math.PI * 2);
          ctx.fillStyle = '#E5C378';
          ctx.shadowBlur = 6;
          ctx.shadowColor = '#C5A059';
          ctx.fill();
        } else if (p.isHeart) {
          var s = p.size;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-s * 0.5, -s * 0.5, -s, s * 0.2, 0, s);
          ctx.bezierCurveTo(s, s * 0.2, s * 0.5, -s * 0.5, 0, 0);
          ctx.closePath();
          ctx.fillStyle = '#7A1A27';
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-p.size, -p.size, -p.size * 1.5, p.size, 0, p.size * 1.5);
          ctx.bezierCurveTo(p.size * 1.5, p.size, p.size, -p.size, 0, 0);
          ctx.fillStyle = '#5C121D';
          ctx.fill();
        }
        ctx.restore();
      }
      requestAnimationFrame(renderPetals);
    }
    renderPetals();
  }

        if (elCoverName) elCoverName.textContent = cleanTo;

        var rsvpNameInput = document.getElementById('rsvpNama');
        if (rsvpNameInput) rsvpNameInput.value = cleanTo;
      }

      if (catParam) {
        var cleanCat = decodeURIComponent(catParam.replace(/\+/g, ' '));
        var elGuestCat = document.getElementById('dynGuestCategory');
        if (elGuestCat) elGuestCat.textContent = cleanCat;
      }
    } catch (e) {
      console.warn('Parameter URL tamu tidak dapat diparsing:', e);

  }

  function updateEqualizerState(playing) {
    var eq = document.querySelector('.audio-equalizer');
    if (!eq) return;
    if (playing) {
      eq.classList.add('playing');
    } else {
      eq.classList.remove('playing');
    }
  }

    // Efek semburan kelopak hati & kilau emas lembut (tanpa efek getar ponsel)
    if (typeof window.triggerPetalBurst === 'function') {
      window.triggerPetalBurst();
    }

    if (coverOverlay) {
      coverOverlay.classList.add('opened');
    }

    playMusicWithFadeIn();

        return;

      if (isAudioPlaying) {

      } else {

      }

  function playMusicWithFadeIn() {
    var appleMusicWrap = document.getElementById('appleMusicWrap');
    if (appleMusicWrap && appleMusicWrap.dataset.active === 'true') {
      toggleAppleMusicWidget(true);
      if (vinylDisc) vinylDisc.classList.add('playing');
      if (audioStatusText) audioStatusText.textContent = 'Apple Music';
      updateEqualizerState(true);
      return;
    }

    if (weddingAudio) {
      if (!weddingAudio.currentSrc && !weddingAudio.src) {
        var audioSrc = document.getElementById('audioSource');
        if (audioSrc && audioSrc.src) {
          weddingAudio.src = audioSrc.src;
        } else {
          weddingAudio.src = DEFAULT_AUDIO_URL;
        }
      }

      weddingAudio.volume = 0.05;
      var playPromise = weddingAudio.play();

      if (playPromise !== undefined) {
        playPromise.then(function() {
          isAudioPlaying = true;
          if (vinylDisc) vinylDisc.classList.add('playing');
          if (audioStatusText) audioStatusText.textContent = 'Memutar Lagu';
          updateEqualizerState(true);

          clearInterval(audioFadeInterval);
          var currentVol = 0.05;
          audioFadeInterval = setInterval(function() {
            if (currentVol < 0.85) {
              currentVol = Math.min(0.85, currentVol + 0.08);
              weddingAudio.volume = currentVol;
            } else {
              clearInterval(audioFadeInterval);
            }
          }, 140);
        }).catch(function(err) {
          console.warn('Autoplay tertahan oleh browser:', err);
          isAudioPlaying = false;
          if (vinylDisc) vinylDisc.classList.remove('playing');
          if (audioStatusText) audioStatusText.textContent = 'Sentuh untuk Putar';
          updateEqualizerState(false);
        });
      }
    }
  }

  function playMusic() {
    var appleMusicWrap = document.getElementById('appleMusicWrap');
    if (appleMusicWrap && appleMusicWrap.dataset.active === 'true') {
      toggleAppleMusicWidget(true);
      if (vinylDisc) vinylDisc.classList.add('playing');

      }

        playPromise.then(function() {
          isAudioPlaying = true;
          if (vinylDisc) vinylDisc.classList.add('playing');
          if (audioStatusText) audioStatusText.textContent = 'Memutar Lagu';
          updateEqualizerState(true);
        }).catch(function(err) {
          console.warn('Pemutaran audio terhalang:', err);
          isAudioPlaying = false;
          if (vinylDisc) vinylDisc.classList.remove('playing');
          if (audioStatusText) audioStatusText.textContent = 'Sentuh untuk Putar';
          updateEqualizerState(false);
        });
      }
    }
  }

  function pauseMusic() {
    if (weddingAudio) {
      clearInterval(audioFadeInterval);
      weddingAudio.pause();
      isAudioPlaying = false;
      if (vinylDisc) vinylDisc.classList.remove('playing');
      if (audioStatusText) audioStatusText.textContent = 'Dijeda';
      updateEqualizerState(false);
    }
  }

  function toggleAppleMusicWidget(forceState) {
    var wrap = document.getElementById('appleMusicWrap');
    if (!wrap) return;
    if (typeof forceState === 'boolean') {
      wrap.style.display = forceState ? 'block' : 'none';
    } else {
      wrap.style.display = (wrap.style.display === 'none' || !wrap.style.display) ? 'block' : 'none';
    }
  }

  function setupAudioPlayer(rawUrl) {
    var str = rawUrl ? String(rawUrl).trim() : DEFAULT_AUDIO_URL;
    var appleMusicWrap = document.getElementById('appleMusicWrap');
    var appleMusicIframe = document.getElementById('appleMusicIframe');

    if (str.indexOf('music.apple.com') !== -1) {
      var embedUrl = str.replace('music.apple.com', 'embed.music.apple.com');
      if (appleMusicIframe) appleMusicIframe.src = embedUrl;
      if (appleMusicWrap) {
        appleMusicWrap.dataset.active = 'true';
        appleMusicWrap.style.display = 'block';
      }
      if (audioStatusText) audioStatusText.textContent = 'Apple Music';
      if (vinylDisc) vinylDisc.classList.add('playing');
      updateEqualizerState(true);
    } else {
      if (appleMusicWrap) {
        appleMusicWrap.dataset.active = 'false';
        appleMusicWrap.style.display = 'none';
      }
      var cleanUrl = convertDriveUrl(str, true);
      var audioSrc = document.getElementById('audioSource');
      if (audioSrc) audioSrc.src = cleanUrl;
      if (weddingAudio) {
        weddingAudio.src = cleanUrl;
        weddingAudio.load();
      }
      if (audioStatusText) audioStatusText.textContent = 'Lagu Pengiring';
    }
  }

  // ==========================================================================
  // 4. PEMBANTU LINK DRIVE & SALIN CLIPBOARD
  // ==========================================================================
  function convertDriveUrl(url, forceAudio) {
    if (!url) return '';
    var str = String(url).trim();

    if (str.indexOf('dropbox.com') !== -1) {
      return str.replace('dl=0', 'raw=1');
    }

    if (str.indexOf('vocaroo.com') !== -1 || str.indexOf('voca.ro') !== -1) {
      if (str.indexOf('media1.vocaroo.com') !== -1) return str;
      var vocMatch = str.match(/voca\.ro\/([a-zA-Z0-9]+)/) || str.match(/vocaroo\.com\/([a-zA-Z0-9]+)/);
      if (vocMatch && vocMatch[1]) {
        return 'https://media1.vocaroo.com/mp3/' + vocMatch[1];
      }
      return str;
    }

    var match = str.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || str.match(/\/d\/([a-zA-Z0-9_-]+)/) || str.match(/id=([a-zA-Z0-9_-]+)/);
    if (match && match[1]) {
      var id = match[1];
      if (forceAudio || str.toLowerCase().indexOf('.mp3') !== -1 || str.toLowerCase().indexOf('audio') !== -1) {
        return 'https://docs.google.com/uc?export=download&id=' + id;
      }
      return 'https://lh3.googleusercontent.com/d/' + id;
    }
    return str;
  }

  function copyToClipboard(text, label) {
    if (!text) return;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        showToast((label || 'Data') + ' berhasil disalin!');
      }).catch(function() {
        fallbackCopyText(text, label);
      });
    } else {
      fallbackCopyText(text, label);
    }
  }

  function fallbackCopyText(text, label) {
    var textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      showToast((label || 'Data') + ' berhasil disalin!');
    } catch (err) {
      showToast('Gagal menyalin teks.');
    }
    document.body.removeChild(textArea);
  }

  function showToast(msg) {
    var toast = document.getElementById('toastMsg');
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(function() {
      toast.classList.remove('show');
    }, 3200);
  }

  // ==========================================================================
  // 5. COUNTDOWN TIMER MUNDUR KE HARI H
  // ==========================================================================
  function initCountdown() {
    var targetDate = new Date('2026-12-19T14:00:00+07:00').getTime();
    var cdDays = document.getElementById('cdDays');
    var cdHours = document.getElementById('cdHours');
    var cdMinutes = document.getElementById('cdMinutes');
    var cdSeconds = document.getElementById('cdSeconds');

    function updateCountdown() {
      var now = new Date().getTime();
      var distance = targetDate - now;

      if (distance < 0) {
        if (cdDays) cdDays.textContent = '00';
        if (cdHours) cdHours.textContent = '00';
        if (cdMinutes) cdMinutes.textContent = '00';
        if (cdSeconds) cdSeconds.textContent = '00';
        return;
      }

      var days = Math.floor(distance / (1000 * 60 * 60 * 24));
      var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((distance % (1000 * 60)) / 1000);

      if (cdDays) cdDays.textContent = ('0' + days).slice(-2);
      if (cdHours) cdHours.textContent = ('0' + hours).slice(-2);
      if (cdMinutes) cdMinutes.textContent = ('0' + minutes).slice(-2);
      if (cdSeconds) cdSeconds.textContent = ('0' + seconds).slice(-2);
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
  }

  // ==========================================================================
  // 6. FORMULIR RSVP & FEED DOA RESTU (DENGAN PENCARIAN & FILTER PUBLIK)
  // ==========================================================================
  function selectAttendance(status) {
    currentGuestAttendance = status;
    var btnYes = document.getElementById('btnAttYes');
    var btnNo = document.getElementById('btnAttNo');
    var groupPax = document.getElementById('groupPax');

    if (status === 'Hadir') {
      if (btnYes) btnYes.classList.add('active');
      if (btnNo) btnNo.classList.remove('active');
      if (groupPax) groupPax.style.display = 'block';
    } else {
      if (btnNo) btnNo.classList.add('active');
      if (btnYes) btnYes.classList.remove('active');
      if (groupPax) groupPax.style.display = 'none';
      currentGuestPax = 0;
    }
  }

  function selectPax(count, el) {
    currentGuestPax = count;
    var pills = document.querySelectorAll('.guest-pill');
    pills.forEach(function(p) { p.classList.remove('active'); });
    if (el) el.classList.add('active');
  }

  function submitRSVPForm() {
    var nama = document.getElementById('rsvpNama').value.trim();
    var kontak = document.getElementById('rsvpKontak').value.trim();
    var pesan = document.getElementById('rsvpPesan').value.trim();
    var btnSubmit = document.getElementById('btnSubmitRSVP');

    if (!nama) {
      showToast('Mohon cantumkan nama lengkap Anda.');
      return;
    }
    if (!pesan) {
      showToast('Mohon tuliskan doa atau ucapan restu Anda.');
      return;
    }

    var rsvpData = {
      nama: nama,
      kontak: kontak,
      kehadiran: currentGuestAttendance,
      pax: currentGuestAttendance === 'Hadir' ? currentGuestPax : 0,
      pesan: pesan
    };

    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Mengirim Doa...';
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(response) {
          if (btnSubmit) {
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Kirim Konfirmasi & Doa';
          }
          if (response && response.status === 'success') {
            showToast('Alhamdulillah, doa restu Anda telah terkirim!');
            document.getElementById('rsvpForm').reset();
            selectAttendance('Hadir');
            rawRSVPData.unshift(response.data);
            filterPublicRSVPFeed();
            if (rsvpData.kehadiran === 'Hadir') {
              openGuestPassModal();
            }
          } else {
            showToast(response.message || 'Gagal mengirim konfirmasi.');
          }
        })
        .withFailureHandler(function(err) {
          if (btnSubmit) {
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Kirim Konfirmasi & Doa';
          }
          showToast('Error koneksi: ' + err.toString());
        })
        .submitRSVP(rsvpData);
    } else {
      setTimeout(function() {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Kirim Konfirmasi & Doa';
        }
        showToast('[Demo Mode] Doa restu Anda berhasil dicatat!');
        rawRSVPData.unshift({
          nama: nama,
          timestamp: 'Baru saja',
          kehadiran: currentGuestAttendance,
          pax: rsvpData.pax,
          pesan: pesan
        });
        filterPublicRSVPFeed();
        document.getElementById('rsvpForm').reset();
        if (rsvpData.kehadiran === 'Hadir') {
          openGuestPassModal();
        }
      }, 600);
    }
  }

  function renderPublicRSVPList(list) {
    var feedList = document.getElementById('feedList');
    if (!feedList) return;
    feedList.innerHTML = '';

    if (!list || list.length === 0) {
      feedList.innerHTML = '<div style="font-size: 12px; color: #888; text-align: center; padding: 12px;">Tidak ada ucapan tamu yang cocok dengan pencarian/filter.</div>';
      return;
    }

    list.forEach(function(item) {
      var badgeText = item.kehadiran === 'Hadir' ? ('Hadir (' + (item.pax || 1) + ' Pax)') : 'Berhalangan';
      var card = document.createElement('div');
      card.className = 'feed-card';
      card.innerHTML =
        '<div class="feed-header">' +
          '<span class="feed-name">' + escapeHtml(item.nama) + '</span>' +
          '<span class="feed-time">' + escapeHtml(item.timestamp || 'Baru saja') + '</span>' +
        '</div>' +
        '<span class="feed-badge">' + badgeText + '</span>' +
        '<p class="feed-msg">' + escapeHtml(item.pesan) + '</p>';
      feedList.appendChild(card);
    });
  }

  function setPublicRSVPFilter(status, btnEl) {
    publicRSVPFilter = status;
    var buttons = document.querySelectorAll('.rsvp-public-filter-row .btn-pub-filter');

    var filtered = rawRSVPData.filter(function(item) {
      var matchStatus = (publicRSVPFilter === 'all') || (item.kehadiran === publicRSVPFilter);

        (item.nama && item.nama.toLowerCase().indexOf(query) !== -1) ||
        (item.pesan && item.pesan.toLowerCase().indexOf(query) !== -1);
      return matchStatus && matchName;
    });

    renderPublicRSVPList(filtered);
  }

    var video = document.getElementById('twibbonLiveVideo');

      }).then(function(stream) {

        video.play();
        showToast('Kamera selfie aktif! Tekan "Jepret Foto Sekarang".');

  function captureTwibbonLiveFrame() {
    var video = document.getElementById('twibbonLiveVideo');
    if (!video || !twibbonLiveStream) return;

    var tempCanvas = document.createElement('canvas');
    tempCanvas.width = video.videoWidth || 720;
    tempCanvas.height = video.videoHeight || 1280;
    var tCtx = tempCanvas.getContext('2d');

    // Mirror selfie agar natural
    tCtx.translate(tempCanvas.width, 0);
    tCtx.scale(-1, 1);
    tCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

    var img = new Image();
    img.onload = function() {
      twibbonUserImg = img;
      twibbonRotation = 0;
      twibbonZoom = 100;
      twibbonOffsetX = 0;
      twibbonOffsetY = 0;
      var zSlider = document.getElementById('twibbonZoomSlider');
      var zLbl = document.getElementById('lblTwibbonZoom');
      if (zSlider) zSlider.value = 100;
      if (zLbl) zLbl.textContent = '100%';
      stopTwibbonLiveCamera();
      drawTwibbonCanvas();
      showToast('Foto selfie berhasil dijepret ke Twibbon 9:16!');
    };
    img.src = tempCanvas.toDataURL('image/png');
  }

  function stopTwibbonLiveCamera() {

    if (video) video.style.display = 'none';

  function initTwibbonDragInteractions() {
    var container = document.getElementById('twibbonContainer');
    if (!container || container.dataset.dragBound === '1') return;
    container.dataset.dragBound = '1';

    function startDrag(x, y) {
      if (!twibbonUserImg) return;
      isDraggingTwibbon = true;
      twibbonDragStartX = x;
      twibbonDragStartY = y;
    }

    function moveDrag(x, y) {
      if (!isDraggingTwibbon) return;
      var dx = (x - twibbonDragStartX) * 4.2;
      var dy = (y - twibbonDragStartY) * 4.2;
      twibbonOffsetX += dx;
      twibbonOffsetY += dy;
      twibbonDragStartX = x;
      twibbonDragStartY = y;
      drawTwibbonCanvas();
    }

    function endDrag() {
      isDraggingTwibbon = false;
    }

    container.addEventListener('mousedown', function(e) { startDrag(e.clientX, e.clientY); });
    window.addEventListener('mousemove', function(e) { moveDrag(e.clientX, e.clientY); });
    window.addEventListener('mouseup', endDrag);

    container.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    container.addEventListener('touchmove', function(e) {
      if (e.touches.length === 1) {
        e.preventDefault();
        moveDrag(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });
    window.addEventListener('touchend', endDrag);
  }

  function drawTwibbonCanvas() {
    var canvas = document.getElementById('twibbonCanvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var w = canvas.width;   // 1080
    var h = canvas.height;  // 1920

    var templates = getAllTwibbonTemplates();
    var activeTpl = templates.find(function(t) { return t.id === selectedTwibbonId; }) || templates[0];

    ctx.clearRect(0, 0, w, h);

    // 1. Latar Belakang Dasar
    ctx.fillStyle = (activeTpl.style === 'ivory-classic') ? '#FCF9F2' : '#240509';
    ctx.fillRect(0, 0, w, h);

    // 2. Render Foto Tamu (Mendukung Drag & Zoom)
    if (twibbonUserImg) {
      ctx.save();
      ctx.translate(w / 2 + twibbonOffsetX, h / 2 + twibbonOffsetY);
      ctx.rotate((twibbonRotation * Math.PI) / 180);

      var scaleFactor = twibbonZoom / 100;
      var imgAspect = twibbonUserImg.width / twibbonUserImg.height;
      var canvasAspect = w / h;
      var drawW, drawH;

      if (imgAspect > canvasAspect) {
        drawH = h * scaleFactor;
        drawW = drawH * imgAspect;
      } else {
        drawW = w * scaleFactor;
        drawH = drawW / imgAspect;
      }
      ctx.drawImage(twibbonUserImg, -drawW / 2, -drawH / 2, drawW, drawH);
      ctx.restore();
    } else {
      // Placeholder Panduan Elegan 9:16
      var grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#4A0E17');
      grad.addColorStop(0.5, '#2E070D');
      grad.addColorStop(1, '#1A0307');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = 'rgba(229, 195, 120, 0.92)';
      ctx.font = '600 38px "Cormorant Garamond", serif';
      ctx.textAlign = 'center';
      ctx.fillText('Ketuk "Kamera Selfie" atau "Galeri"', w / 2, h / 2 - 20);
      ctx.font = '400 26px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
      ctx.fillText('untuk memasang foto Anda di Twibbon 9:16', w / 2, h / 2 + 32);
    }

    // 3. Render Desain Bingkai Berdasarkan Jenis Template yang Dipilih
    if (activeTpl.style === 'custom-png' && activeTpl.url) {
      if (twibbonCustomOverlayCache[activeTpl.url]) {
        ctx.drawImage(twibbonCustomOverlayCache[activeTpl.url], 0, 0, w, h);
      } else {
        var overlayImg = new Image();
        overlayImg.crossOrigin = 'anonymous';
        overlayImg.onload = function() {
          twibbonCustomOverlayCache[activeTpl.url] = overlayImg;
          drawTwibbonCanvas();
        };
        overlayImg.src = activeTpl.url;
      }
      return;
    }

    if (activeTpl.style === 'ivory-classic') {
      // TEMA 3: LUXURY IVORY MINIMALIS (EDITORIAL MAGAZINE 9:16)
      ctx.save();
      ctx.strokeStyle = '#FCF9F2';
      ctx.lineWidth = 76;
      ctx.strokeRect(38, 38, w - 76, h - 76);

      ctx.strokeStyle = '#C5A059';
      ctx.lineWidth = 4;
      ctx.strokeRect(68, 68, w - 136, h - 136);

      // Footer Editorial Ivory
      ctx.fillStyle = '#FCF9F2';
      ctx.fillRect(68, h - 320, w - 136, 252);

      ctx.fillStyle = '#9A7730';
      ctx.font = '700 24px "Cinzel", serif';
      ctx.textAlign = 'center';
      ctx.fillText('THE WEDDING CELEBRATION OF', w / 2, h - 245);

      ctx.fillStyle = '#4A0E17';
      ctx.font = '400 108px "Great Vibes", cursive';
      ctx.fillText('Cahyo & Hani', w / 2, h - 140);

      ctx.fillStyle = '#6B5558';
      ctx.font = '600 24px "Plus Jakarta Sans", sans-serif';
      ctx.fillText('19 • 12 • 2026  |  KAUR, BENGKULU', w / 2, h - 88);
      ctx.restore();
      return;
    }

    if (activeTpl.style === 'floral-gold') {
      // TEMA 2: FLORAL MAWAR & EMAS (VIGNETTE ROMANTIS + ARCH DOUBLE GOLD)
      ctx.save();
      var topGrad = ctx.createLinearGradient(0, 0, 0, 340);
      topGrad.addColorStop(0, 'rgba(42, 6, 11, 0.88)');
      topGrad.addColorStop(1, 'rgba(42, 6, 11, 0)');
      ctx.fillStyle = topGrad;
      ctx.fillRect(0, 0, w, 340);

      var botGrad = ctx.createLinearGradient(0, h - 460, 0, h);
      botGrad.addColorStop(0, 'rgba(42, 6, 11, 0)');
      botGrad.addColorStop(0.45, 'rgba(42, 6, 11, 0.85)');
      botGrad.addColorStop(1, 'rgba(28, 4, 7, 0.98)');
      ctx.fillStyle = botGrad;
      ctx.fillRect(0, h - 460, w, 460);

      // Bingkai Emas Ganda
      ctx.strokeStyle = '#E5C378';
      ctx.lineWidth = 5;
      ctx.strokeRect(46, 46, w - 92, h - 92);
      ctx.strokeStyle = 'rgba(229, 195, 120, 0.45)';
      ctx.lineWidth = 2;
      ctx.strokeRect(64, 64, w - 128, h - 128);

      // Medali Monogram C&H Atas
      ctx.beginPath();
      ctx.arc(w / 2, 130, 56, 0, Math.PI * 2);
      ctx.fillStyle = '#4A0E17';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#E5C378';
      ctx.stroke();

      ctx.fillStyle = '#E5C378';
      ctx.font = '700 32px "Cinzel", serif';
      ctx.textAlign = 'center';
      ctx.fillText('C&H', w / 2, 141);

      // Tipografi Bawah
      ctx.fillStyle = '#E5C378';
      ctx.font = '600 24px "Cinzel", serif';
      ctx.fillText('WALIMATUL \'URSY', w / 2, h - 265);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '400 116px "Great Vibes", cursive';
      ctx.fillText('Cahyo & Hani', w / 2, h - 155);

      ctx.fillStyle = '#F5DEB3';
      ctx.font = '500 24px "Plus Jakarta Sans", sans-serif';
      ctx.fillText('Sabtu & Minggu, 19–20 Desember 2026', w / 2, h - 95);
      ctx.restore();
      return;
    }

    // TEMA 1 (DEFAULT): ROYAL ARCH BURGUNDY & GOLD FOIL BOKEH (9:16)
    ctx.save();
    // Vignette atas & bawah mewah
    var vTop = ctx.createLinearGradient(0, 0, 0, 320);
    vTop.addColorStop(0, 'rgba(28, 4, 7, 0.90)');
    vTop.addColorStop(1, 'rgba(28, 4, 7, 0)');
    ctx.fillStyle = vTop;
    ctx.fillRect(0, 0, w, 320);

    var vBot = ctx.createLinearGradient(0, h - 480, 0, h);
    vBot.addColorStop(0, 'rgba(28, 4, 7, 0)');
    vBot.addColorStop(0.4, 'rgba(42, 6, 11, 0.92)');
    vBot.addColorStop(1, '#1A0307');
    ctx.fillStyle = vBot;
    ctx.fillRect(0, h - 480, w, 480);

    // Bingkai Kubah Cathedral Arch Emas
    ctx.beginPath();
    ctx.moveTo(56, h - 56);
    ctx.lineTo(56, 460);
    ctx.arc(w / 2, 460, (w - 112) / 2, Math.PI, 0, false);
    ctx.lineTo(w - 56, h - 56);
    ctx.closePath();
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#E5C378';
    ctx.stroke();

    // Lencana Header Kubah
    ctx.fillStyle = '#4A0E17';
    ctx.beginPath();
    ctx.roundRect(w / 2 - 220, 74, 440, 64, 32);
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#E5C378';
    ctx.stroke();

    ctx.fillStyle = '#E5C378';
    ctx.font = '700 24px "Cinzel", serif';
    ctx.textAlign = 'center';
    ctx.fillText('WALIMATUL \'URSY', w / 2, 115);

    // Taburan Kilau Emas Bokeh
    var sparkles = [
      [140, 240, 6], [930, 260, 7], [120, 1480, 8], [950, 1450, 6],
      [210, 1560, 4], [870, 1550, 5], [180, 340, 4], [890, 330, 5]
    ];
    sparkles.forEach(function(sp) {
      ctx.beginPath();
      ctx.arc(sp[0], sp[1], sp[2], 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(229, 195, 120, 0.75)';
      ctx.fill();
    });

    // Garis Pemisah Emas & Kaligrafi Utama Bawah
    ctx.strokeStyle = '#C5A059';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(w / 2 - 180, h - 310);
    ctx.lineTo(w / 2 + 180, h - 310);
    ctx.stroke();

    ctx.fillStyle = '#E5C378';
    ctx.font = '400 124px "Great Vibes", cursive';
    ctx.fillText('Cahyo & Hani', w / 2, h - 190);

    ctx.fillStyle = '#FCF9F2';
    ctx.font = '600 25px "Cormorant Garamond", serif';
    ctx.fillText('SABTU, 19 DESEMBER 2026 • DESA AURRINGIT, KAUR', w / 2, h - 122);
    ctx.restore();
  }

  function downloadTwibbonResult() {
    var canvas = document.getElementById('twibbonCanvas');
    if (!canvas) return;

  function startCameraScanner() {
    var video = document.getElementById('scannerVideo');
    if (!video) return;

    if (!scannerOffscreenCanvas) {
      scannerOffscreenCanvas = document.createElement('canvas');
    }

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentCameraFacing },
        audio: false
      }).then(function(stream) {
        scannerStream = stream;
        video.srcObject = stream;
        video.setAttribute('playsinline', true);
        video.play();
        initUniversalQrDetection(video);
      }).catch(function() {
        showToast('Kamera live dibatasi browser. Gunakan tombol "Foto QR via Kamera HP" di bawah.');
      });
    } else {
      showToast('Gunakan tombol "Foto QR via Kamera HP" untuk memindai QR tamu.');
    }
  }

  function stopCameraScanner() {
    clearInterval(scannerScanInterval);
    if (scannerStream) {
      scannerStream.getTracks().forEach(function(track) { track.stop(); });
      scannerStream = null;
    }
  }

  function switchCameraFacing() {
    stopCameraScanner();
    currentCameraFacing = (currentCameraFacing === 'environment') ? 'user' : 'environment';
    startCameraScanner();

  function initUniversalQrDetection(video) {
    clearInterval(scannerScanInterval);
    var barcodeDetector = ('BarcodeDetector' in window)
      ? new BarcodeDetector({ formats: ['qr_code'] })
      : null;

    var lastScannedCode = '';
    var lastScannedTime = 0;

    scannerScanInterval = setInterval(function() {
      if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

      // 1. Gunakan jsQR Universal (Kompatibel iPhone Safari, Android & Desktop)
      if (typeof jsQR === 'function' && scannerOffscreenCanvas) {
        var vw = video.videoWidth || 480;
        var vh = video.videoHeight || 480;
        scannerOffscreenCanvas.width = vw;
        scannerOffscreenCanvas.height = vh;
        var ctx = scannerOffscreenCanvas.getContext('2d');
        ctx.drawImage(video, 0, 0, vw, vh);
        var imageData = ctx.getImageData(0, 0, vw, vh);
        var code = jsQR(imageData.data, vw, vh, { inversionAttempts: 'dontInvert' });

        if (code && code.data) {
          var now = Date.now();
          if (code.data !== lastScannedCode || (now - lastScannedTime) > 4000) {
            lastScannedCode = code.data;
            lastScannedTime = now;
            onQRCodeScanned(code.data);
          }
          return;
        }
      }

      // 2. Cadangan Native BarcodeDetector jika tersedia
      if (barcodeDetector) {
        barcodeDetector.detect(video).then(function(barcodes) {
          if (barcodes.length > 0) {
            var now2 = Date.now();
            if (barcodes[0].rawValue !== lastScannedCode || (now2 - lastScannedTime) > 4000) {
              lastScannedCode = barcodes[0].rawValue;
              lastScannedTime = now2;
              onQRCodeScanned(barcodes[0].rawValue);
            }
          }
        }).catch(function() {});
      }
    }, 350);
  }

  function handleQrPhotoCapture(input) {
    var file = input.files && input.files[0];
    if (!file) return;

    showToast('Membaca QR Code dari foto...');
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var c = document.createElement('canvas');
        var maxDim = 1000;
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, c.width, c.height);

        if (typeof jsQR === 'function') {
          var imgData = ctx.getImageData(0, 0, c.width, c.height);
          var qr = jsQR(imgData.data, c.width, c.height);
          if (qr && qr.data) {
            onQRCodeScanned(qr.data);
          } else {
            showToast('QR Code tidak terbaca pada foto. Pastikan QR terlihat jelas & terang.');
          }
        } else {
          showToast('Pustaka pembaca QR sedang dimuat, coba sesaat lagi.');
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function onQRCodeScanned(scannedText) {
    var parts = scannedText.split('|');
    var guestName = parts.length > 1 ? decodeURIComponent(parts[1]) : scannedText;

    var alertBox = document.getElementById('scanSuccessAlert');
    var nameEl = document.getElementById('scanGuestName');
    if (alertBox && nameEl) {
      nameEl.textContent = guestName + ' (Menyimpan kehadiran...)';
      alertBox.style.display = 'block';
    }

    showToast('Tamu Terdeteksi: ' + guestName);

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            if (nameEl) {
              nameEl.textContent = (res.guestName || guestName) + ' (' + (res.kategori || 'Hadir') + ') ✅';
            }
            showToast('Berhasil Check-In: ' + (res.guestName || guestName));
            if (typeof loadGuestList === 'function') {
              loadGuestList();
            }
          } else {
            showToast(res.message || 'Gagal mencatat check-in.');
          }
        })
        .withFailureHandler(function(err) {
          showToast('Koneksi check-in gagal: ' + err.toString());
        })
        .checkInGuest(guestName, currentAdminPin);
    } else {
      if (nameEl) {
        nameEl.textContent = guestName + ' [Demo Mode Tercatat] ✅';
      }
      showToast('[Demo Mode] Kehadiran tamu berhasil dicatat!');
    }
  }

  // ==========================================================================
  // 11. EKSPOR REKAP VENDOR KATERING (.CSV 1-KLIK)
  // ==========================================================================
  function exportCateringCSV() {
    if (!rawRSVPData || rawRSVPData.length === 0) {
      showToast('Data RSVP masih kosong, belum dapat diekspor.');
      return;
    }

    var csvRows = [];
    csvRows.push("No;Nama Tamu;Kontak WhatsApp;Kehadiran;Jumlah Pax;Pesan Doa;Waktu Konfirmasi");

    var totalPaxHadir = 0;
    var totalTamuHadir = 0;

    for (var i = 0; i < rawRSVPData.length; i++) {
      var item = rawRSVPData[i];
      var isHadir = (item.kehadiran === 'Hadir');
      var pax = isHadir ? (parseInt(item.pax, 10) || 1) : 0;
      if (isHadir) {
        totalTamuHadir++;
        totalPaxHadir += pax;
      }

      var row = [
        i + 1,
        '"' + (item.nama || '').replace(/"/g, '""') + '"',
        '"' + (item.kontak || '').replace(/"/g, '""') + '"',
        item.kehadiran || 'Hadir',
        pax,
        '"' + (item.pesan || '').replace(/"/g, '""') + '"',
        '"' + (item.timestamp || '') + '"'
      ];
      csvRows.push(row.join(';'));
    }

    csvRows.push("");
    csvRows.push(";;;TOTAL TAMU HADIR;" + totalTamuHadir + ";;");
    csvRows.push(";;;TOTAL PORSI KATERING (PAX);" + totalPaxHadir + ";;");

    var csvString = "\uFEFF" + csvRows.join("\n");
    var blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement("a");
    var url = URL.createObjectURL(blob);
    link.setAttribute("href", url);
    link.setAttribute("download", "Rekap_Vendor_Katering_Cahyo_Hani.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    showToast('Rekap Katering (' + totalPaxHadir + ' Pax) berhasil diunduh!');
  }

  function loadRSVPFeedAndAnalytics() {

    google.script.run.withSuccessHandler(function(res) {
      if (res && res.status === 'success' && res.data) {

  function updateCateringAnalytics(list) {
    var total = list.length;
    var hadir = 0;
    var tidakHadir = 0;
    var totalPax = 0;

    list.forEach(function(item) {
      if (item.kehadiran === 'Hadir') {
        hadir++;
        totalPax += parseInt(item.pax, 10) || 1;
      } else {
        tidakHadir++;
      }
    });

    var statTotal = document.getElementById('statTotalRSVP');
    var statPax = document.getElementById('statTotalPax');
    var statHad = document.getElementById('statHadir');
    var statNo = document.getElementById('statTidakHadir');
    var barHadir = document.getElementById('barHadir');
    var lblRatio = document.getElementById('lblRatioPercent');

    if (statTotal) statTotal.textContent = total;
    if (statPax) statPax.textContent = totalPax;
    if (statHad) statHad.textContent = hadir;
    if (statNo) statNo.textContent = tidakHadir;

    var ratio = total > 0 ? Math.round((hadir / total) * 100) : 0;
    if (barHadir) barHadir.style.width = ratio + '%';
    if (lblRatio) lblRatio.textContent = ratio + '% Tamu Hadir (' + totalPax + ' Pax)';
  }

  function renderDetailedRSVPTable(list) {
    var tbody = document.getElementById('rsvpDetailedTableBody');
    if (!tbody) return;
    tbody.innerHTML = '';

    if (!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#888; padding: 14px;">Belum ada data konfirmasi kehadiran.</td></tr>';
      return;
    }

    list.forEach(function(item) {
      var isHadir = (item.kehadiran === 'Hadir');
      var badgeHtml = isHadir
        ? '<span class="status-badge sent">Hadir</span>'
        : '<span class="status-badge pending">Berhalangan</span>';
      var paxText = isHadir ? (item.pax || 1) + ' Pax' : '-';

      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><strong>' + escapeHtml(item.nama) + '</strong></td>' +
        '<td>' + badgeHtml + '</td>' +
        '<td>' + paxText + '</td>' +
        '<td style="max-width: 140px; font-size: 11px;">' + escapeHtml(item.pesan || '-') + '</td>' +
        '<td style="font-size: 10px; color:#888;">' + escapeHtml(item.timestamp || '-') + '</td>';

      tbody.appendChild(tr);
    });
  }

  function filterRSVPTable() {
    var searchVal = (document.getElementById('searchRSVPInput').value || '').toLowerCase().trim();

  function onTargetPhotoChanged(targetId) {
    currentPhotoTargetId = targetId || 'dynPhotoPria';
    var targetImg = document.getElementById(currentPhotoTargetId);
    var previewImg = document.getElementById('canvasPreviewImg');
    var maskShape = document.getElementById('canvasMaskShape');

    if (targetImg && previewImg) {
      previewImg.src = targetImg.src;
    }

    if (currentPhotoTargetId === 'dynHeroPhoto' || currentPhotoTargetId.indexOf('dynGaleri') !== -1 || currentPhotoTargetId.indexOf('dynStoryFoto') !== -1) {
      if (maskShape) maskShape.style.borderRadius = '16px';
    } else {
      if (maskShape) maskShape.style.borderRadius = '50%';
    }

    if (!photoTransforms[currentPhotoTargetId]) {
      photoTransforms[currentPhotoTargetId] = { zoom: 100, x: 50, y: 50 };
    }

    var t = photoTransforms[currentPhotoTargetId];
    var slider = document.getElementById('sliderZoom');
    var lbl = document.getElementById('lblZoomVal');
    if (slider) slider.value = t.zoom;
    if (lbl) lbl.textContent = t.zoom + '%';

    updateCanvasPreview();
  }

  function onZoomSliderChanged(val) {
    if (!photoTransforms[currentPhotoTargetId]) {
      photoTransforms[currentPhotoTargetId] = { zoom: 100, x: 50, y: 50 };
    }
    photoTransforms[currentPhotoTargetId].zoom = parseInt(val, 10) || 100;
    var lbl = document.getElementById('lblZoomVal');
    if (lbl) lbl.textContent = val + '%';
    updateCanvasPreview();
  }

  function nudgePhoto(dx, dy) {
    if (!photoTransforms[currentPhotoTargetId]) {
      photoTransforms[currentPhotoTargetId] = { zoom: 100, x: 50, y: 50 };
    }
    var t = photoTransforms[currentPhotoTargetId];
    t.x = Math.max(0, Math.min(100, t.x + dx));
    t.y = Math.max(0, Math.min(100, t.y + dy));
    updateCanvasPreview();
  }

  function resetPhotoTransform() {
    photoTransforms[currentPhotoTargetId] = { zoom: 100, x: 50, y: 50 };
    var slider = document.getElementById('sliderZoom');
    var lbl = document.getElementById('lblZoomVal');
    if (slider) slider.value = 100;
    if (lbl) lbl.textContent = '100%';
    updateCanvasPreview();
  }

  function updateCanvasPreview() {
    var previewImg = document.getElementById('canvasPreviewImg');
    if (!previewImg) return;
    var t = photoTransforms[currentPhotoTargetId] || { zoom: 100, x: 50, y: 50 };
    var scale = t.zoom / 100;
    previewImg.style.objectPosition = t.x + '% ' + t.y + '%';
    previewImg.style.transform = 'scale(' + scale + ')';
  }

      targetImg.style.transform = scale > 1 ? 'scale(' + scale + ')' : '';
      showToast('Posisi & zoom diterapkan! Klik "Simpan" di atas agar tersimpan permanen.');
    }
    closePhotoAdjustModal();
  }

  function initCanvasDragInteractions() {
    var previewBox = document.getElementById('canvasPreviewBox');
    if (!previewBox) return;

    function handleStart(clientX, clientY) {
      isDraggingCanvasPhoto = true;
      canvasDragStartX = clientX;
      canvasDragStartY = clientY;
    }

    function handleMove(clientX, clientY) {
      if (!isDraggingCanvasPhoto) return;
      var diffX = clientX - canvasDragStartX;
      var diffY = clientY - canvasDragStartY;

      if (Math.abs(diffX) > 4 || Math.abs(diffY) > 4) {
        var stepX = (diffX > 0 ? 1 : -1) * 2;
        var stepY = (diffY > 0 ? 1 : -1) * 2;
        nudgePhoto(-stepX, -stepY);
        canvasDragStartX = clientX;
        canvasDragStartY = clientY;
      }
    }

    function handleEnd() {
      isDraggingCanvasPhoto = false;
    }

    previewBox.addEventListener('mousedown', function(e) { handleStart(e.clientX, e.clientY); });
    window.addEventListener('mousemove', function(e) { handleMove(e.clientX, e.clientY); });
    window.addEventListener('mouseup', handleEnd);

    previewBox.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        handleStart(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    window.addEventListener('touchmove', function(e) {
      if (e.touches.length === 1) {
        handleMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    window.addEventListener('touchend', handleEnd);
  }

  function enableLiveInlineEditing() {
    var editableElements = document.querySelectorAll('.live-editable');
    editableElements.forEach(function(el) {
      el.contentEditable = 'true';
      el.setAttribute('spellcheck', 'false');

  function initScrollReveal() {
    var items = document.querySelectorAll('.reveal-on-scroll');
    if (!items.length) return;

    if ('IntersectionObserver' in window) {
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('revealed');
            entry.target.classList.remove('scroll-hidden');
          } else {
            if (entry.boundingClientRect.top > 0) {
              entry.target.classList.remove('revealed');
              entry.target.classList.add('scroll-hidden');
            }
          }
        });
      }, {
        threshold: 0.12,
        rootMargin: '0px 0px -30px 0px'
      });

      items.forEach(function(el) {
        observer.observe(el);
      });
    } else {
      items.forEach(function(el) {
        el.classList.add('revealed');
      });
    }
  }

    var currentUrl = window.location.href.split('?')[0].split('#')[0];
    if (currentUrl.indexOf('/dev') !== -1) {
      currentUrl = currentUrl.replace('/dev', '/exec');
    }
    return currentUrl;
  }

  function toggleGuestInputMode(mode) {
    var fSingle = document.getElementById('formGuestSingle');

    var bBulk = document.getElementById('btnModeBulk');

    if (mode === 'bulk') {
      if (fSingle) fSingle.style.display = 'none';
      if (fBulk) fBulk.style.display = 'block';
      if (bSingle) bSingle.classList.remove('active');
      if (bBulk) bBulk.classList.add('active');
    } else {
      if (fSingle) fSingle.style.display = 'block';
      if (fBulk) fBulk.style.display = 'none';
      if (bSingle) bSingle.classList.add('active');
      if (bBulk) bBulk.classList.remove('active');

    var file = input.files && input.files[0];

    reader.onload = function(e) {

      document.getElementById('bulkPasteInput').value = content;

  function handlePasteInputChanged() {
    var text = document.getElementById('bulkPasteInput').value;
    parsedBulkGuests = parseCsvOrTsv(text);
    renderBulkPreview(parsedBulkGuests);
  }

  function parseCsvOrTsv(text) {
    if (!text || !text.trim()) return [];
    var cleanText = text.replace(/^\uFEFF/, '');
    var lines = cleanText.split(/\r\n|\n|\r/);
    var results = [];

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;

      var delimiter = '\t';
      if (line.indexOf('\t') !== -1) delimiter = '\t';
      else if (line.indexOf(';') !== -1) delimiter = ';';
      else if (line.indexOf(',') !== -1) delimiter = ',';

      var cols = line.split(delimiter);
      var col1 = cols[0] ? cols[0].replace(/^["']|["']$/g, '').trim() : '';
      var col2 = cols[1] ? cols[1].replace(/^["']|["']$/g, '').trim() : '';
      var col3 = cols[2] ? cols[2].replace(/^["']|["']$/g, '').trim() : 'Teman';

      if (i === 0 && (col1.toLowerCase() === 'nama' || col1.toLowerCase() === 'nama_tamu' || col1.toLowerCase() === 'name')) {
        continue;
      }

      if (col1) {
        results.push({
          nama: col1,
          wa: col2,
          kategori: col3 || 'Teman'
        });
      }
    }
    return results;
  }

  function renderBulkPreview(guests) {
    var container = document.getElementById('bulkPreviewContainer');
    var tbody = document.getElementById('bulkPreviewTableBody');
    var notice = document.getElementById('bulkStatusNotice');
    if (!container || !tbody) return;

    if (!guests || guests.length === 0) {
      container.style.display = 'none';
      if (notice) notice.style.display = 'none';
      return;
    }

    container.style.display = 'block';
    tbody.innerHTML = '';

    guests.slice(0, 8).forEach(function(g) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + escapeHtml(g.nama) + '</td>' +
        '<td>' + escapeHtml(g.wa || '-') + '</td>' +
        '<td>' + escapeHtml(g.kategori || 'Teman') + '</td>';
      tbody.appendChild(tr);
    });

    if (notice) {
      notice.style.display = 'block';
      notice.textContent = 'Terdeteksi ' + guests.length + ' baris tamu siap diimpor ke Google Sheets.';
    }
  }

  function processBulkGuests() {
    if (!parsedBulkGuests || parsedBulkGuests.length === 0) {
      showToast('Tidak ada data tamu yang valid untuk diimpor.');
      return;
    }

    var btn = document.getElementById('btnProcessBulk');
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Menyimpan ' + parsedBulkGuests.length + ' Tamu...';
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Simpan Semua Tamu ke Database';
          }
          if (res && res.status === 'success') {
            showToast('Berhasil mengimpor ' + res.count + ' tamu!');
            clearBulkInputs();
            toggleGuestInputMode('single');
            loadGuestList();
          } else {
            showToast(res.message || 'Gagal menyimpan batch.');
          }
        })
        .withFailureHandler(function(err) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Simpan Semua Tamu ke Database';
          }
          showToast('Error impor: ' + err.toString());
        })
        .importGuestsBatch(parsedBulkGuests, currentAdminPin);
    }
  }

  function renderCurrentQueueItem() {
    if (currentQueueIndex >= guestQueueList.length) {
      showToast('Semua tamu dalam antrean telah selesai!');
      closeQueueModal();
      return;
    }

    var g = guestQueueList[currentQueueIndex];
    var counter = document.getElementById('queueCounterText');
    var elName = document.getElementById('queueGuestName');
    var elMeta = document.getElementById('queueGuestMeta');
    var elLink = document.getElementById('queuePreviewLink');

    if (counter) counter.textContent = 'Tamu ' + (currentQueueIndex + 1) + ' dari ' + guestQueueList.length;
    if (elName) elName.textContent = g.nama;
    if (elMeta) elMeta.textContent = (g.wa || 'Tanpa Nomor') + ' • ' + (g.kategori || 'Tamu');

    var appUrl = getEffectiveAppUrl();
    if (elLink) elLink.textContent = appUrl + '?to=' + encodeURIComponent(g.nama);
  }

  function sendAndNextQueue() {
    if (currentQueueIndex >= guestQueueList.length) return;
    var g = guestQueueList[currentQueueIndex];
    handleGuestSent(g.id, g.wa, g.nama);
    currentQueueIndex++;
    renderCurrentQueueItem();
  }

  function skipQueueGuest() {
    currentQueueIndex++;
    renderCurrentQueueItem();
  }

  function escapeHtml(text) {
    if (!text) return '';
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
