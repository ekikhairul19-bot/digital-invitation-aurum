<style>
  /* ==========================================================================
     DESIGN TOKENS - CLASSIC ROMANCE BURGUNDY & LUXURY IVORY
     Penyelarasan Presisi Mengacu pada Referensi Canva & Revisi Terkini
     ========================================================================== */
  :root {
    --color-burgundy-deep: #2A060B;
    --color-burgundy: #4A0E17;
    --color-burgundy-wine: #5C121D;
    --color-burgundy-light: #7A1A27;
    --color-burgundy-soft: #F5EAEB;
    --color-cream-bg: #FCF9F2;
    --color-card-bg: #FFFFFF;
    --color-card-inner: #FAF5ED;
    --color-gold-accent: #C5A059;
    --color-gold-bright: #E5C378;
    --color-gold-dark: #9A7730;
    --color-text-dark: #2B1619;
    --color-text-muted: #6B5558;
    --color-border-subtle: #E8DDD2;
    --color-border-burgundy: #B08287;
    
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-cinzel: 'Cinzel', serif;
    --font-script: 'Great Vibes', cursive;
    --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
    
    --shadow-soft: 0 10px 30px rgba(42, 6, 11, 0.08);
    --shadow-wax: 0 8px 24px rgba(42, 6, 11, 0.45);
    --radius-arch: 140px 140px 24px 24px;
    --radius-card: 20px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #1A0307;
    font-family: var(--font-sans);
    color: var(--color-text-dark);
    line-height: 1.6;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* Canvas Partikel Kelopak Hati & Kilau Emas Melayang */
  #petalCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
  }

  /* Viewport Seluler Elegan (Mobile-First 480px) */
  .app-viewport {
    width: 100%;
    max-width: 480px;
    background-color: var(--color-cream-bg);
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.65);
    overflow-x: hidden;
    padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  }

  /* ==========================================================================
     PENATAAN PRESISI ELEMEN VISUAL
     ========================================================================== */

  /* SLIDE 1: Ranting Bunga Plum Merah di Kiri Lengkungan Kartu Cover */
  .flower-cover-branch {
    position: absolute;
    top: -12px;
    left: -14px;
    width: 100px;
    height: 210px;
    object-fit: contain;
    pointer-events: none;
    z-index: 14;
    transform: scaleX(-1);
    filter: drop-shadow(0 4px 10px rgba(42, 6, 11, 0.45));
    transition: transform 0.3s ease;
  }

  /* Buket Bunga di Sudut Kanan Bawah Tombol Buka Undangan */
  .flower-cover-lily, .flower-cover-corner {
    position: absolute;
    bottom: -22px;
    right: -16px;
    width: 140px;
    height: auto;
    pointer-events: none;
    z-index: 16;
    filter: drop-shadow(0 6px 16px rgba(42, 6, 11, 0.4));
    transition: transform 0.3s ease;
  }

  /* Stempel Lilin Fisik Menggantikan Monogram C&H di Cover (Slide 1) */
  .wax-seal-wrapper {
    position: relative;
    width: 122px;
    height: 122px;
    margin: 0 auto 12px auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Bingkai Barok Emas Konsentris Melingkari Stempel Lilin */
  .crest-frame-seal {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 118px;
    height: 118px;
    object-fit: contain;
    pointer-events: none;
    z-index: 5;
    filter: drop-shadow(0 4px 12px rgba(197, 160, 89, 0.35));
  }

  .wax-seal-real-img {
    width: 82px;
    height: 82px;
    object-fit: contain;
    filter: drop-shadow(0 8px 22px rgba(42, 6, 11, 0.65));
    cursor: pointer;
    position: relative;
    z-index: 10;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .wax-seal-real-img:hover, .wax-seal-real-img:active {
    transform: scale(1.08);
  }

  .seal-ripple {
    position: absolute;
    top: -4px;
    left: -4px;
    right: -4px;
    bottom: -4px;
    border-radius: 50%;
    border: 1px solid var(--color-gold-accent);
    animation: pulseRipple 2.2s infinite;
    pointer-events: none;
  }

  @keyframes pulseRipple {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 0.2; }
    100% { transform: scale(0.95); opacity: 0.8; }
  }

  /* Bunga 5 Kelopak Pink Air di Puncak Kubah Arch Hero */
  .hero-crest-wrapper {
    position: relative;
    width: 165px;
    height: 78px;
    margin: -48px auto 10px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    pointer-events: none;
  }

  .flower-hero-pink {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 155px;
    height: auto;
    pointer-events: none;
    z-index: 1;
    filter: drop-shadow(0 4px 10px rgba(42, 6, 11, 0.25));
  }

  .wax-seal-stamp {
    width: 54px;
    height: 54px;
    background: radial-gradient(circle, #7A1A27 0%, #3D090F 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-gold-bright);
    border: 2px solid var(--color-gold-accent);
    box-shadow: var(--shadow-wax);
    font-family: var(--font-cinzel);
    font-size: 18px;
    font-weight: bold;
    position: relative;
    z-index: 2;
    pointer-events: auto;
  }

  /* Buket Bunga di Kiri Bawah Arch Hero (Terkunci Ukuran & Posisi Agar Tidak Menghalangi Teks) */
  .flower-hero-crescent {
    position: absolute;
    bottom: -16px;
    left: -14px;
    width: 132px;
    height: auto;
    pointer-events: none;
    z-index: 6;
    filter: drop-shadow(0 6px 14px rgba(42, 6, 11, 0.3));
  }

  /* Dua Bunga di Atas "Maha Suci Allah" Saling Berhadapan */
  .flower-twin-crescents-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin: 0 auto 12px auto;
    pointer-events: none;
  }

  .flower-twin-item {
    width: 95px;
    height: auto;
    filter: drop-shadow(0 3px 8px rgba(42, 6, 11, 0.22));
  }

  .flower-twin-item.twin-right {
    transform: scaleX(-1);
  }

  /* Tangkai Daun Eucalyptus Sage Asimetris pada Foto Mempelai */
  .couple-photo-outer {
    position: relative;
    width: 120px;
    margin: 0 auto 16px auto;
  }

  .eucalyptus-accent-pria {
    position: absolute;
    top: -16px;
    left: -20px;
    width: 68px;
    height: auto;
    pointer-events: none;
    z-index: 5;
    filter: drop-shadow(0 3px 8px rgba(42, 6, 11, 0.18));
    transform: rotate(-18deg);
  }

  .eucalyptus-accent-wanita {
    position: absolute;
    bottom: -12px;
    right: -20px;
    width: 68px;
    height: auto;
    pointer-events: none;
    z-index: 5;
    filter: drop-shadow(0 3px 8px rgba(42, 6, 11, 0.18));
    transform: rotate(162deg);
  }

  /* Bunga Anggrek Putih pada Kartu Mempelai Pria Dihapus Total */
  .flower-mempelai-orchid {
    display: none !important;
  }

  /* Bunga 5 Kelopak Pink Air di Bawah Countdown Timer (205px) */
  .flower-countdown-pink {
    display: block;
    margin: 22px auto 10px auto;
    width: 205px;
    height: auto;
    pointer-events: none;
    filter: drop-shadow(0 4px 14px rgba(42, 6, 11, 0.25));
    transition: width 0.3s ease;
  }

  /* Buket Mawar Pink Pastel di Sudut Kanan Atas Kartu Akad & Resepsi */
  .flower-event-pastel {
    position: absolute;
    top: -24px;
    right: -20px;
    width: 150px;
    height: auto;
    pointer-events: none;
    z-index: 10;
    filter: drop-shadow(0 6px 14px rgba(42, 6, 11, 0.28));
  }

  /* Untaian Bunga Menjuntai Samping Header "Our Journey" */
  .flower-journey-garland-wrap {
    position: relative;
    width: 100%;
    margin-top: 10px;
  }

  .flower-journey-garland-left {
    position: absolute;
    top: -95px;
    left: -20px;
    width: 210px;
    height: 520px;
    object-fit: contain;
    object-position: top center;
    pointer-events: none;
    z-index: 4;
    opacity: 0.95;
    filter: drop-shadow(0 4px 10px rgba(42, 6, 11, 0.22));
  }

  .flower-journey-garland-right {
    position: absolute;
    top: -95px;
    right: -20px;
    width: 210px;
    height: 520px;
    object-fit: contain;
    object-position: top center;
    pointer-events: none;
    z-index: 4;
    opacity: 0.95;
    transform: scaleX(-1);
    filter: drop-shadow(0 4px 10px rgba(42, 6, 11, 0.22));
  }

  /* Buket Bunga di Tengah Our Journey */
  .flower-ribbon-roses {
    display: block;
    margin: 10px auto 6px auto;
    width: 155px;
    height: auto;
    pointer-events: none;
    position: relative;
    z-index: 6;
    filter: drop-shadow(0 6px 16px rgba(42, 6, 11, 0.32));
  }

  /* Anggrek Putih Menjuntai di Sudut Kanan Atas Foto Babak 1, 2, 3 */
  .flower-journey-orchid {
    position: absolute;
    top: -16px;
    right: -14px;
    width: 110px;
    height: auto;
    pointer-events: none;
    z-index: 15;
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.35));
    transform-origin: top right;
  }

  /* Penskalaan Responsif di Layar Ponsel Sempit */
  @media (max-width: 380px) {
    .flower-cover-branch {
      width: 90px;
      height: 190px;
      left: -10px;
      transform: scaleX(-1);
    }
    .flower-cover-lily, .flower-cover-corner {
      width: 135px;
      bottom: -18px;
      right: -12px;
    }
    .flower-hero-pink {
      width: 140px;
    }
    .flower-hero-crescent {
      width: 115px;
      bottom: -14px;
      left: -12px;
    }
    .hero-photo-wrap {
      height: 380px;
    }
    .flower-twin-item {
      width: 85px;
    }
    .flower-twin-item.twin-right {
      transform: scaleX(-1);
    }
    .flower-countdown-pink {
      width: 180px;
    }
    .flower-event-pastel {
      width: 140px;
      top: -20px;
      right: -16px;
    }
    .flower-journey-garland-left {
      width: 180px;
      height: 460px;
      top: -80px;
      left: -16px;
    }
    .flower-journey-garland-right {
      width: 180px;
      height: 460px;
      top: -80px;
      right: -16px;
      transform: scaleX(-1);
    }
    .flower-ribbon-roses {
      width: 145px;
    }
    .flower-journey-orchid {
      width: 105px;
      top: -14px;
      right: -12px;
    }
  }

  /* ==========================================================================
     COVER SCREEN (3D LUXURY ENVELOPE - SLIDE 1 REFERENSI)
     ========================================================================== */
  .cover-overlay {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    background: radial-gradient(circle at 50% 30%, #520F19 0%, #200407 100%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    color: #FFF;
    transition: transform 1.1s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.9s ease;
  }

  .cover-overlay.opened {
    transform: translate(-50%, -100%);
    opacity: 0;
    pointer-events: none;
  }

  .envelope-scene {
    width: 100%;
    max-width: 380px;
    position: relative;
    perspective: 1000px;
  }

  .cover-top-ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 16px;
    position: relative;
    z-index: 2;
  }

  .ornament-line {
    width: 36px;
    height: 1px;
    background: var(--color-gold-accent);
  }

  .ornament-text {
    font-family: var(--font-cinzel);
    font-size: 11.5px;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: var(--color-gold-bright);
    font-weight: 600;
  }

  .cover-envelope-card {
    background: #FAF6EF;
    border-radius: var(--radius-arch);
    padding: 38px 22px 28px 22px;
    border: 2px solid var(--color-gold-accent);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    position: relative;
    color: var(--color-text-dark);
  }

  .envelope-flap {
    display: none !important;
  }

  .cover-card-content {
    position: relative;
    z-index: 2;
  }

  .cover-tagline {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--color-burgundy);
    font-weight: 600;
  }

  .cover-title {
    font-family: var(--font-script);
    font-size: 48px;
    line-height: 1.15;
    color: var(--color-burgundy-deep);
    margin: 6px 0 10px 0;
  }

  .cover-date-pill {
    display: inline-block;
    font-family: var(--font-serif);
    font-size: 13.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--color-burgundy);
    border-top: 1px solid var(--color-gold-accent);
    border-bottom: 1px solid var(--color-gold-accent);
    padding: 5px 16px;
    margin-bottom: 18px;
    font-weight: 600;
  }

  .cover-guest-box {
    padding: 14px 12px;
    background: rgba(74, 14, 23, 0.04);
    border-radius: 12px;
    border: 1px dashed var(--color-border-burgundy);
    margin-bottom: 18px;
  }

  .cover-guest-badge {
    display: inline-block;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--color-burgundy);
    color: #FFF;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .cover-guest-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--color-text-muted);
  }

  .cover-guest-name {
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 700;
    color: var(--color-burgundy);
    margin-top: 4px;
  }

  .btn-wax-open {
    background: linear-gradient(145deg, #7A1A27, #420A12);
    border: 1.5px solid var(--color-gold-bright);
    color: #FFF;
    padding: 12px 28px;
    border-radius: 40px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(66, 10, 18, 0.4);
    transition: all 0.25s ease;
  }

  .btn-wax-open:hover, .btn-wax-open:active {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(66, 10, 18, 0.6);
  }

  .cover-notice {
    font-size: 11px;
    color: var(--color-gold-bright);
    margin-top: 14px;
    letter-spacing: 0.5px;
    opacity: 0.85;
    position: relative;
    z-index: 2;
  }

  /* ==========================================================================
     FLOATING AUDIO CONTROLLER (VINYL STYLE)
     ========================================================================== */
  .audio-floating-player {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    right: 20px;
    z-index: 800;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(252, 249, 242, 0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 6px 14px 6px 8px;
    border-radius: 40px;
    border: 1px solid var(--color-gold-accent);
    box-shadow: 0 6px 20px rgba(42, 6, 11, 0.25);
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .audio-floating-player:active {
    transform: scale(0.96);
  }

  .vinyl-disc {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle, #222 25%, #111 26%, #111 70%, #222 71%);
    border: 2px solid var(--color-gold-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    animation: spinVinyl 6s linear infinite;
    animation-play-state: paused;
  }

  .vinyl-disc.playing {
    animation-play-state: running;
  }

  .vinyl-groove {
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px dashed rgba(229, 195, 120, 0.4);
    pointer-events: none;
  }

  .vinyl-center {
    width: 12px;
    height: 12px;
    background: #7A1A27;
    border-radius: 50%;
    border: 1px solid #FFF;
    z-index: 2;
  }

  @keyframes spinVinyl {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .audio-info {
    display: flex;
    flex-direction: column;
  }

  .audio-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--color-burgundy);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .audio-sub {
    font-size: 9px;
    color: var(--color-text-muted);
  }

  .audio-equalizer {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
    margin-left: 2px;
  }

  .eq-bar {
    width: 2.5px;
    height: 4px;
    background: var(--color-burgundy);
    border-radius: 2px;
    transition: height 0.2s ease;
  }

  .audio-equalizer.playing .eq-bar:nth-child(1) {
    animation: eqBounce 0.7s infinite alternate ease-in-out;
  }
  .audio-equalizer.playing .eq-bar:nth-child(2) {
    animation: eqBounce 0.5s infinite alternate-reverse ease-in-out 0.15s;
  }
  .audio-equalizer.playing .eq-bar:nth-child(3) {
    animation: eqBounce 0.8s infinite alternate ease-in-out 0.3s;
  }
  .audio-equalizer.playing .eq-bar:nth-child(4) {
    animation: eqBounce 0.6s infinite alternate-reverse ease-in-out 0.1s;
  }

  @keyframes eqBounce {
    0% { height: 4px; }
    100% { height: 14px; }
  }

  /* ==========================================================================
     HERO SECTION (KUBAH ARCH UTAMA DIPERBESAR PENUH SESUAI REFERENSI)
     ========================================================================== */
  .hero-section {
    padding: 44px 20px 20px 20px;
    text-align: center;
    position: relative;
  }

  .arch-frame-card {
    background: var(--color-card-bg);
    border-radius: 195px 195px 24px 24px;
    border: 1px solid var(--color-border-subtle);
    padding: 32px 14px 28px 14px;
    box-shadow: var(--shadow-soft);
    position: relative;
  }

  .arch-inner-border {
    border: 1px solid var(--color-border-burgundy);
    border-radius: 185px 185px 18px 18px;
    padding: 14px 12px 24px 12px;
    position: relative;
  }

  .hero-photo-wrap {
    width: 100%;
    max-width: 100%;
    height: 430px;
    margin: 0 auto 20px auto;
    border-radius: 175px 175px 14px 14px;
    overflow: hidden;
    position: relative;
    border: 1.5px solid var(--color-gold-accent);
    box-shadow: 0 8px 24px rgba(42, 6, 11, 0.14);
    cursor: zoom-in;
  }

  .hero-photo-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform-origin: center center;
    transition: object-position 0.3s ease, transform 0.3s ease;
  }

  .photo-overlay-vignette {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at center, transparent 68%, rgba(42, 6, 11, 0.25) 100%);
    pointer-events: none;
    border-radius: inherit;
  }

  .hero-eyebrow {
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--color-gold-dark);
    font-weight: 700;
    position: relative;
    z-index: 12;
  }

  .hero-names {
    font-family: var(--font-script);
    font-size: 50px;
    line-height: 1.15;
    color: var(--color-burgundy-deep);
    margin: 4px 0 8px 0;
    position: relative;
    z-index: 12;
  }

  .hero-date-badge {
    display: inline-block;
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 700;
    color: var(--color-burgundy-deep);
    letter-spacing: 1.5px;
    border: 1px solid var(--color-gold-accent);
    border-radius: 30px;
    padding: 5px 18px;
    margin-top: 2px;
    position: relative;
    z-index: 12;
    background: rgba(255, 255, 255, 0.94);
  }

  .hero-location {
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--color-text-muted);
    margin-top: 8px;
    position: relative;
    z-index: 12;
  }

  /* ==========================================================================
     QUOTE SECTION - BERSIH, SAKRAL & KONTRAS
     ========================================================================== */
  .section-quote {
    padding: 20px;
    text-align: center;
  }

  .quote-card {
    background: var(--color-card-inner);
    border-radius: 16px;
    padding: 28px 22px;
    border: 1px solid var(--color-border-subtle);
